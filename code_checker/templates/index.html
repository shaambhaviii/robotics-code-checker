<!DOCTYPE html>
<html>
<head>
    <title>Robotics Code Checker</title>

    <!-- Funky Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;

            /* Pastel gradient background */
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
        }

        .container {
            width: 520px;
            margin: 100px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        h2 {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            font-size: 32px;
            margin-bottom: 8px;

            /* Colorful gradient text */
            background: linear-gradient(90deg, #ff6a00, #ee0979, #6a11cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
        }

        form {
            text-align: center;
        }

        input[type="file"] {
            margin: 15px 0;
        }

        button {
            padding: 10px 25px;
            background-color: #6a11cb;
            border: none;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #4a0dab;
        }

        .result {
            margin-top: 25px;
            background: #f7f7f7;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            border-left: 4px solid #6a11cb;
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Robotics Code Checker</h2>
        <p class="subtitle">
            Validate robot control code before simulation
        </p>

        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="code_file" required><br>
            <button type="submit">Run Code Check</button>
        </form>

        {% if result %}
        <div class="result">
            <strong>Result:</strong>
            <pre>{{ result | tojson(indent=2) }}</pre>
        </div>
        {% endif %}

        <div class="footer">
            Internship Assignment • Simulation Safety Layer
        </div>
    </div>
</body>
</html>
